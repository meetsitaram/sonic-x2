# Walking-recovery real-deploy tuning preset (Phase 1b).
#
# Use case: SONIC under live teleop where the operator needs forward
# stride initiation and forward push recovery to work. Identical to
# expressive.yaml EXCEPT for FIVE sagittal-chain KD scales that have
# been reverted from the 2026-05-15 PM static-nudge bumps to full
# MC-published values: ankle_pitch (3.31 = MC), knee (0.792 = MC),
# hip (0.476 = MC). Lateral chain (ankle_roll, waist_pr) is left at
# MC-match.
#
# Why this preset exists (2026-05-30, end-to-end Quest3 walking session):
# expressive.yaml was tuned to kill a 5-7 Hz ankle resonance observed
# under STATIC chest-nudge. The fix lifted kd_scale_ankle_pitch to 5.0
# (+51% over MC-match) and bumped kd_scale_hip + kd_scale_knee to 2.0
# (3-4x and 2.5x over MC, respectively). That stopped the resonance but
# turned out to over-damp the entire sagittal recovery chain for the
# dynamic walking case: when the policy asks the leg to swing forward
# (forward stride OR forward push recovery), the kd*omega braking term
# consumes most of the actuator's torque budget, leaving no headroom
# for the kp*error term that's supposed to drive the motion. Operator
# observation under expressive.yaml: "robot stiff sideways (recovers
# well laterally), but cannot recover from a forward chest-nudge -- it
# leans forward and locks." Comparison: MC's STAND_DEFAULT is compliant
# and recovers nicely on the same push, because MC's published KD
# values are not bumped above the trained baseline.
#
# Torque budget argument (using AGI's actuator-class peak torques):
#   Hip pitch / knee actuator = PFP-96-57, peak 120 N*m.
#     At kd_scale_hip=2.0 (expressive.yaml), effective kd at the joint
#     is trained_kd=6.31 * 2.0 = 12.62 N*m*s/rad. A 10 rad/s recovery
#     swing produces kd*omega = 126 N*m of braking torque -- exceeds
#     the actuator's 120 N*m peak. Damping alone saturates the motor;
#     kp authority is zero. THIS is the failure mode.
#   Ankle pitch actuator = PFP-74-56, peak 60 N*m.
#     At kd_scale_ankle_pitch=5.0, effective kd = 0.907 * 5.0 = 4.54.
#     At 5 rad/s swing: kd*omega = 22.7 N*m = 38% of peak. Less severe
#     than hip/knee but still eating a third of the budget.
#
# Phase 1 (2026-05-30 first cut): dropped hip + knee scales from the
# expressive.yaml static-nudge bumps (2.0) back to trained baseline
# (1.0), dropped ankle_pitch to MC-match (3.31x). KP scales unchanged.
# Result on real robot: rocking sway persisted at 1-2 Hz under SONIC
# idle stand. Robot felt stiff at hip+knee even though static stand
# tracking was crisp.
#
# Phase 1b (2026-05-30 PM, this preset's CURRENT state): drop hip
# kd to 0.476 and knee kd to 0.792 -- both at FULL MC-match. The
# Phase 1 baselines were still 2.10x (hip) and 1.26x (knee) over MC,
# which over-damped the sagittal chain enough that the policy could
# only balance with the ankle ("ankle strategy"). The ankle pendulums
# the whole upper body at 1-2 Hz with the short ankle moment arm =
# the visible rocking. MC stands stably with these exact kd values,
# so they are physically validated.
#
# Operator-derived hypothesis (2026-05-30): "hip pitch and knee are
# too stiff; the rocking happens because the ankle has to compensate
# for the whole balancing act." This matches the ankle-strategy
# failure mode from the biomechanics literature. See README.
#
# Do NOT start with this preset on a fresh model -- run conservative.yaml
# first to confirm the policy can stand, then expressive.yaml to confirm
# it can hold posture under static nudges, THEN switch to this for
# active walking sessions.
description: |
  Phase 1b: sagittal kd at FULL MC-match (ankle_pitch 3.31, knee 0.792,
  hip 0.476). Same KP scales + lateral kd + clamps + LPF as
  expressive.yaml. Targets the "ankle-strategy" failure mode where
  over-damped hip+knee force the ankle to balance the whole stack and
  produce 1-2 Hz rocking sway. Use this for active walking /
  push-recovery teleop after expressive.yaml has shown the policy is
  otherwise well-behaved.

action_clip:    20.0   # match training (base_env.yaml: action_clip_value=20).
                       # Same rationale as expressive.yaml: anything larger
                       # lets the policy emit OOD action_il and the last_action
                       # proprioception fed back diverges further.
max_target_dev:        0.30  # ~17 deg global default (legs/waist/head fall
                             # under this unless overridden below).
max_target_dev_leg:    0.50  # ~29 deg. Same as expressive.yaml. With the
                             # sagittal kd drop below the leg actually USES
                             # this travel during recovery -- under expressive
                             # the clamp wasn't binding because the damping
                             # term was; here it might bind on a hard nudge.
                             # Phase 2 (only if needed): consider raising to
                             # 0.70 if Phase 1 stride is still pinched.
max_target_dev_waist:  0.30  # unchanged from expressive.yaml
max_target_dev_arm:    1.50  # unchanged from expressive.yaml
max_target_dev_head:   0.50  # unchanged from expressive.yaml
ramp_seconds:    2.0
return_seconds:  2.0
tilt_cos:       -0.3
target_lpf_hz:        8.0   # ~5 Hz effective bandwidth. Applies to arms +
                            # head (legs + waist have explicit overrides
                            # below). Kept at 8.0 because arm/head jitter
                            # tames well here and we have no evidence
                            # they need the wider bandwidth that legs and
                            # waist do for active-loop response.
target_lpf_hz_leg:    16.0  # Per-group override on the legs (MJ 0..11).
                            # Raised from inherited 8.0 -> 16.0 (~10 Hz
                            # bandwidth) after the 2026-05-30 eve push
                            # scan revealed in-loop phase lag at 8 Hz
                            # was contributing to a 2-3.5 Hz knee +
                            # ankle ring (left_knee flip_hz 3.5,
                            # vel_rms 0.59 rad/s, pos_p2p 0.22 rad).
                            # At 16 Hz the phase lag at the policy's
                            # 2-4 Hz operating band drops from ~20-30°
                            # to <13° -- the LPF is effectively
                            # transparent for the policy's corrective
                            # commands while still rejecting >25 Hz
                            # sensor obs noise.
target_lpf_hz_waist:  16.0  # Per-group override on the waist (MJ 12..14).
                            # Reverted UPWARD from the earlier 3.0 Hz
                            # attempt, which made everything worse:
                            #
                            #   Iteration 1 (no waist override, inherit
                            #     8 Hz): waist_pitch/roll oscillated at
                            #     2-2.5 Hz, 11-13 deg p2p.
                            #   Iteration 2 (target_lpf_hz_waist=3.0):
                            #     waist_pitch dropped to 1.5 Hz BUT
                            #     ballooned to 18-25 deg p2p (worse).
                            #
                            # Diagnosis: SONIC is closed-loop (sees its
                            # own waist state via proprioception every
                            # 50 Hz tick), so an LPF on the COMMAND path
                            # only adds phase lag without filtering what
                            # the policy reacts to. At 3 Hz cutoff the
                            # phase lag at the 2 Hz resonance was ~34°,
                            # which is exactly the bandwidth where the
                            # closed loop becomes unstable. The waist
                            # didn't need bandwidth limiting -- it needed
                            # the phase-lag knob LEFT ALONE.
                            #
                            # 16 Hz (= ~10 Hz bandwidth, ~7° phase lag
                            # at 2 Hz) restores fast correction while
                            # still suppressing the >25 Hz sensor noise
                            # the LPF was originally added for.
                            # If lateral compliance is still the
                            # complaint after this, the right knob is
                            # max_target_dev_waist (clamps how far the
                            # policy can chase a lateral disturbance)
                            # or a kd_scale_waist_pr split into separate
                            # pitch/roll knobs, not the LPF.
# target_lpf_hz_arm / _head left at default (null = inherit global 8 Hz).

# ---- Deployment-time PD trim (Phase 1 sagittal kd revert) ---------------
# KP scales: unchanged from expressive.yaml. The policy was trained
# against MC-match stiffness; cutting kp would move the loop gain off-
# design AND reduce the joint's static-load support (the robot would
# sag at idle). Stiffness is fine; we only touch velocity damping.
kp_scale_ankle_pitch: 1.87  # MC-match (unchanged from expressive.yaml)
kp_scale_ankle_roll:  1.40  # MC-match (unchanged)
kp_scale_knee:        1.51  # MC-match (unchanged)
kp_scale_waist_yaw:   1.00  # MC-match (unchanged)
kp_scale_waist_pr:    2.81  # MC-match (unchanged)
# KD scales -- THIS IS WHAT CHANGES vs expressive.yaml.
kd_scale_ankle_pitch: 3.31  # REVERTED from expressive.yaml's 5.00 back to
                            # MC-match (trained kd 0.907 * 3.31 = 3.0 = MC's
                            # 3.0 N*m*s/rad on ankle_pitch). The +51% bump
                            # in expressive killed static ankle resonance
                            # but over-damped dynamic stride swing. If a
                            # forward push under this preset reintroduces
                            # the 5-7 Hz ankle ring we saw at kd_scale 2.0
                            # in the May 15 PM test, walk this back UP to
                            # 4.0 (about halfway between MC and the +51%
                            # bump). Do NOT go below 3.0 (= MC-match);
                            # ankle resonance becomes catastrophic.
kd_scale_ankle_roll:  2.20  # MC-match (unchanged). Lateral chain feels right
                            # under expressive ("hard to push sideways but
                            # stable"); the AGI ankle_roll actuator (PFP-59-
                            # 60, peak 36 N*m) has plenty of torque headroom
                            # at this damping level (kd*omega ~2-4 N*m at
                            # typical roll velocities = 5-11% of peak), so
                            # no torque-budget pressure here.
kd_scale_knee:        0.792 # PHASE 1b: dropped from the Phase 1 trained
                            # baseline (1.00) to full MC-match. Effective
                            # kd = 6.31 * 0.792 = 5.00 = MC's published
                            # knee damping (from STAND_DEFAULT scan, see
                            # docs/source/user_guide/x2_pd_tuning_with_mc_scan.md).
                            # Rationale: at Phase 1 the knee kd was 1.26x
                            # MC, which together with hip kd 2.10x MC
                            # over-damped the entire sagittal chain and
                            # forced the policy into ankle-only balance
                            # ("ankle strategy"). With knee + hip too
                            # stiff to articulate, the ankle pendulums the
                            # whole stack at 1-2 Hz -- the visible rocking
                            # sway the operator reported under Phase 1.
                            # MC stands stably with kd_knee=5.0, so this
                            # value is physically validated on the real
                            # robot.
                            # Phase 1c walkback (if this introduces a new
                            # failure): 0.80 (kd_eff ~5.05), 0.85 (~5.36),
                            # 0.90 (~5.68). DO NOT go below 0.792 without
                            # an explicit MC re-scan confirming MC's own
                            # value has shifted.
kd_scale_hip:         0.476 # PHASE 1b: dropped from the Phase 1 trained
                            # baseline (1.00) to full MC-match. Effective
                            # kd = 6.31 * 0.476 = 3.00 = MC's published
                            # hip damping (STAND_DEFAULT scan).
                            #
                            # This is the SINGLE biggest knob in the
                            # preset. At Phase 1 (1.00), hip kd was 2.10x
                            # MC -- the worst over-damping in the sagittal
                            # chain. The hip is the dominant joint for
                            # forward-walking and forward push recovery
                            # because the moment arm is long and the link
                            # mass below it is the whole leg. Over-damping
                            # it forces the policy to fail BOTH hip-strategy
                            # balance (it can't push the upper body back
                            # because kd*omega eats the torque budget on
                            # any commanded motion) AND forward stride
                            # initiation (same mechanism).
                            #
                            # IMPORTANT SIDE-EFFECTS to watch:
                            # - This scale matches by substring "hip", so
                            #   it ALSO drops hip_roll and hip_yaw damping
                            #   to MC level. Lateral feels "good" under
                            #   Phase 1; at MC-match it drops to MC level
                            #   (which is by definition stable, but feels
                            #   less stiff side-to-side).
                            # - Hip-yaw at half damping can introduce a
                            #   low-amplitude yaw shimmy at heel-strike.
                            #   If it appears, add a kd_scale_hip_yaw split
                            #   in PdScaleSpec (does not currently exist;
                            #   see x2_deploy_onnx_ref.cpp:1073).
                            # Phase 1c walkback: 0.55 (kd_eff ~3.5), 0.65
                            # (~4.1), 0.80 (~5.05). DO NOT go below 0.476
                            # without an explicit MC re-scan.
kd_scale_waist_yaw:   3.13  # MC-match (unchanged)
kd_scale_waist_pr:    5.51  # LEGACY alias (applies to both waist_pitch +
                            # waist_roll). MC-match. Kept here as the
                            # baseline value; the per-axis knobs below
                            # let us trim pitch vs roll independently
                            # WITHOUT changing this number.

# ---- Per-axis waist-pr split (Phase 2 scaffold, off by default) ---------
# The 2026-05-30 MC-vs-SONIC torso-nudge scan showed pitch and roll
# diverge from MC in opposite directions even at numerically identical
# PD: waist_pitch resistance ran +45% STRONGER than MC, waist_roll
# resistance ran -72% UNDER MC. This is the asymmetry-of-load problem
# (arms hang symmetric about pitch, swing the whole COM laterally
# about roll) plus the policy-is-a-gait-tracker problem (the commanded
# target moves WITH lateral disturbance). The combined kd_scale_waist_pr
# above cannot close the lateral gap without breaking the sagittal
# axis we already have right -- so we split it.
#
# The four knobs below default to 1.0 (commented out = inherit). When
# you UNCOMMENT one, the effective scale becomes
#   kd_scale_waist * kd_scale_waist_pr * kd_scale_waist_{pitch,roll}
# So at the defaults below this preset behaves exactly as before this
# split landed; flip the operator-validated values back in once the
# post-LPF-fix lateral nudge scan tells us the right direction and
# magnitude. Do NOT prescribe a starting value here without that scan.
#
# kp_scale_waist_pitch: 1.0  # sagittal lean stiffness (SONIC already
#                            # over MC here; expect to leave at 1.0)
# kp_scale_waist_roll:  1.0  # lateral lean stiffness  (the candidate
#                            # for bumping if scan says "stiffen roll")
# kd_scale_waist_pitch: 1.0  # sagittal lean damping (SONIC already
#                            # over MC here; expect to leave at 1.0)
# kd_scale_waist_roll:  1.0  # lateral lean damping (direction TBD --
#                            # gait-tracker dynamics + LPF interactions
#                            # mean the right move could be EITHER up
#                            # or down; only a scan can tell us which)
